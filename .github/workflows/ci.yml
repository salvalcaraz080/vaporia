name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaporia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: Headless sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Smoke test the balance sim
        run: godot --headless --path . -s res://tools/sim_main.gd -- --runs 25 --policies random,greedy,rarity --smoke
      - name: Locked families stay out of offers
        run: godot --headless --path . -s res://tools/check_locked_offers.gd

  web:
    name: Web export
    needs: sim
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Export single-threaded web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
      - name: Write Cloudflare _headers
        run: |
          cat > build/web/_headers << 'EOF'
          # Export filenames are not content-hashed, so revalidate after each deploy.
          # Single-threaded build: do not set COOP or COEP.
          /*
            Cache-Control: public, max-age=0, must-revalidate
          /*.wasm
            Content-Type: application/wasm
            Cache-Control: public, max-age=0, must-revalidate
          /*.pck
            Content-Type: application/octet-stream
            Cache-Control: public, max-age=0, must-revalidate
          EOF
      - name: Force-push web-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f build/web/index.html
          cd build/web
          git init -q
          git checkout --orphan web-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Web export ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:web-build
